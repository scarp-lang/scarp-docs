version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # TypeScript 6's transpileModule API is used to build the standalone
    # browser controller and portable offline Node server. Review TS7 API
    # changes and full browser/compiler CI before a major upgrade.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
