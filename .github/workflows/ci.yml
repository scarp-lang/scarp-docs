name: Documentation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check TypeScript and Vue sources
        run: npm run typecheck
      - name: Ensure documentation tooling uses TypeScript
        run: npm run check:tooling
      - name: Verify supported Vue/TypeScript toolchain and dependency-update policy
        run: npm run check:toolchain && npm run test:toolchain
      - name: Check pages and local links
        run: npm run check:docs
      - name: Regression-test Unicode Markdown link anchors
        run: npm run test:docs-slug
      - name: Check Hindi translation parity
        run: npm run check:i18n
      - name: Detect unsupported runnable Scarp and CLI syntax
        run: npm run check:snippets
      - name: Unit-test documented syntax policy
        run: npm run test:snippets
      - name: Unit-test Markdown fenced-code scanner
        run: npm run test:code-fences
      - name: Check verified example fixtures
        run: npm run check:fixtures
      - name: Verify published alpha.2 example provenance and bilingual snippets
        run: npm run check:alpha2
      - name: Verify newest alpha.3 source provenance, JSON and bilingual examples
        run: npm run check:alpha3
      - name: Check published alpha.3 CLI documentation and English/Hindi parity
        run: npm run check:cli-reference
      - name: Test CLI documentation drift detection
        run: npm run test:cli-reference
      - name: Compare bilingual feature status with all published release manifests
        run: npm run check:release-status
      - name: Test feature status release-drift detection
        run: npm run test:release-status
      - name: Verify alpha.2 typed bindings lesson against published source and stdout
        run: npm run check:typed-bindings
      - name: Test typed bindings evidence and translation drift detection
        run: npm run test:typed-bindings
      - name: Verify bilingual Unicode queries and string construction against release fixtures
        run: npm run check:unicode-text
      - name: Regression-test Unicode lesson source and CLI version boundaries
        run: npm run test:unicode-text
      - name: Verify tagged bitwise positive and negative fixture evidence in both languages
        run: npm run check:bitwise
      - name: Regression-test binary operators, commands and bilingual output
        run: npm run test:bitwise
      - name: Check complete alpha.1 and alpha.2 bilingual module guide against published fixtures
        run: npm run check:modules-guide
      - name: Regression-test modules visibility, source/output and versioned CLI drift
        run: npm run test:modules-guide
      - name: Validate published alpha.4 project source, manifest and English/Hindi release guides
        run: npm run check:alpha4-projects
      - name: Regression-test alpha.4 release, CLI and generated project evidence
        run: npm run test:alpha4-projects
      - name: Validate bilingual alpha.3 to alpha.4 migration instructions
        run: npm run check:alpha4-migration
      - name: Test release-aware migration and source safety regressions
        run: npm run test:alpha4-migration
      - name: Validate alpha.4 Windows, Linux and macOS installation against tagged assets
        run: npm run check:alpha4-installation
      - name: Regression-test installation checksum, release identity and translation drift
        run: npm run test:alpha4-installation
      - name: Validate published alpha.4 CLI commands and bilingual reference
        run: npm run check:alpha4-cli
      - name: Detect command drift and unreleased CLI references
        run: npm run test:alpha4-cli
      - name: Validate published alpha.5 release and bilingual compiler references
        run: npm run check:alpha5
      - name: Reject wrong alpha.5 source, capabilities, downloads and translation drift
        run: npm run test:alpha5
      - name: Verify alpha.6 Windows Linux macOS installer commands and SHA-256 safeguards
        run: npm run check:alpha6-installation
      - name: Mutation-test bilingual installer version, source, checksum and navigation
        run: npm run test:alpha6-installation
      - name: Validate published alpha.6 source and bilingual guides
        run: npm run check:alpha6
      - name: Regression-test alpha.6 release evidence and translation drift
        run: npm run test:alpha6
      - name: Check complete bilingual alpha.6 project tutorial against the tagged sources
        run: npm run check:alpha6-project
      - name: Mutation-test project syntax, exact output, translator parity and navigation
        run: npm run test:alpha6-project
      - name: Check bilingual learning path, staged release boundaries and current onboarding
        run: npm run check:learning-path
      - name: Mutation-test release-aware learning and outdated latest-version claims
        run: npm run test:learning-path
      - name: Test latest compiler release detection without network
        run: npm run test:compiler-release-drift
      - name: Validate docs-only prerelease metadata and version
        run: npm run check:docs-prerelease
      - name: Regression-test prerelease-only publication safety
        run: npm run test:docs-prerelease
      - name: Verify tagged alpha.2 negative diagnostics and bilingual repair guide
        run: npm run check:alpha2-errors
      - name: Verify tutorials reproduce pinned compiler fixtures
        run: npm run check:tutorial-evidence
      - name: Unit-test tutorial evidence validator
        run: npm run test:tutorial-evidence
      - name: Verify English/Hindi fixture statistics against manifest
        run: npm run check:coverage-statistics
      - name: Unit-test coverage statistics checks
        run: npm run test:coverage-statistics
      - name: Unit-test SEO URL helpers
        run: npm run test:site-meta
      - name: Unit-test typed deployment API and fallbacks
        run: npm run test:pages-api
      - name: Unit-test live Pages routes and failure diagnostics without network
        run: npm run test:live-site
      - name: Build VitePress site
        run: npm run docs:build
      - name: Verify bilingual generated HTML and SEO metadata
        run: npm run check:site-build

  compiler-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: afe8b5380c9d6c4774162e51c6c9bc8b90901671
          path: .compiler
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript automation dependencies
        run: npm install --no-audit --no-fund
      - name: Verify checked out compiler commit
        run: test "$(git -C .compiler rev-parse HEAD)" = "afe8b5380c9d6c4774162e51c6c9bc8b90901671"
      - name: Check pinned fixture sources and outputs
        run: npm run check:fixtures -- .compiler/examples
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: e4db8e191cd7ea623123cae7348450ca6c95b170
          path: .compiler-alpha2
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: 7715c28df09c7703b39e14fddb963275b25df476
          path: .compiler-alpha3
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: 79141329176f5dce51457e90a6652902f6432135
          path: .compiler-alpha4
      - name: Check additional published alpha.4 source commit
        run: test "$(git -C .compiler-alpha4 rev-parse HEAD)" = "79141329176f5dce51457e90a6652902f6432135"
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: 2eeed0aa52ccb59523307841ad8ffbd83f8911a8
          path: .compiler-alpha5
      - name: Check exact published alpha.5 source commit
        run: test "$(git -C .compiler-alpha5 rev-parse HEAD)" = "2eeed0aa52ccb59523307841ad8ffbd83f8911a8"
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: aa329a22cf2bf92d2c9814a26ff9c8b67a72e6e8
          path: .compiler-alpha6
          persist-credentials: false
      - name: Verify exact published alpha.6 source commit
        run: test "$(git -C .compiler-alpha6 rev-parse HEAD)" = "aa329a22cf2bf92d2c9814a26ff9c8b67a72e6e8"
      - name: Validate compiler-evidence links across six published tags
        run: npm run check:evidence -- .compiler .compiler-alpha2 .compiler-alpha3 .compiler-alpha4 .compiler-alpha5 .compiler-alpha6
      - name: Build released Scarp interpreter
        run: cargo build --manifest-path .compiler/Cargo.toml --locked --offline
      - name: Execute all documented conformance examples
        run: npm run test:compiler -- .compiler/target/debug/scarp

  alpha2-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: e4db8e191cd7ea623123cae7348450ca6c95b170
          path: .compiler-alpha2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript automation dependencies
        run: npm install --no-audit --no-fund
      - name: Verify exact alpha.2 release source
        run: test "$(git -C .compiler-alpha2 rev-parse HEAD)" = "e4db8e191cd7ea623123cae7348450ca6c95b170"
      - name: Compare all alpha.2 source/output bytes with published examples
        run: npm run check:alpha2 -- .compiler-alpha2/examples
      - name: Verify published alpha.2 negative diagnostic fixture bytes
        run: npm run check:alpha2-errors -- .compiler-alpha2/tests/fixtures
      - name: Verify two bitwise failure fixture files against tagged compiler sources
        run: npm run check:bitwise -- .compiler-alpha2/tests/fixtures/bits
      - name: Build published alpha.2 interpreter
        run: cargo build --manifest-path .compiler-alpha2/Cargo.toml --locked --offline
      - name: Verify original alpha.1 programs remain compatible with released alpha.2
        run: npm run test:alpha2-backcompat -- .compiler-alpha2/target/debug/scarp
      - name: Execute alpha.2 conformance examples and inspection command smoke tests
        run: npm run test:alpha2 -- .compiler-alpha2/target/debug/scarp
      - name: Verify six published failure diagnostics on check and run
        run: npm run test:alpha2-errors -- .compiler-alpha2/target/debug/scarp
      - name: Verify exact alpha.2 shift and radix errors on check and run
        run: npm run test:bitwise-alpha2 -- .compiler-alpha2/target/debug/scarp
      - name: Verify static module text and JSON inventory, visibility, and import failure semantics
        run: npm run test:module-inspection-alpha2 -- .compiler-alpha2/target/debug/scarp

  alpha3-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: 7715c28df09c7703b39e14fddb963275b25df476
          path: .compiler-alpha3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript automation
        run: npm install --no-audit --no-fund
      - name: Verify exact published alpha.3 compiler commit
        run: test "$(git -C .compiler-alpha3 rev-parse HEAD)" = "7715c28df09c7703b39e14fddb963275b25df476"
      - name: Validate all published alpha.3 sources, expected outputs and diagnostic JSON
        run: npm run check:alpha3 -- .compiler-alpha3/examples
      - name: Build tagged alpha.3 compiler
        run: cargo build --manifest-path .compiler-alpha3/Cargo.toml --locked --offline
      - name: Verify new Scarp-first CLI and four byte-exact release programs
        run: npm run test:alpha3 -- .compiler-alpha3/target/debug/scarp

  alpha4-project-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: 79141329176f5dce51457e90a6652902f6432135
          path: .compiler-alpha4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript conformance dependencies
        run: npm install --no-audit --no-fund
      - name: Check exact published alpha.4 compiler commit
        run: test "$(git -C .compiler-alpha4 rev-parse HEAD)" = "79141329176f5dce51457e90a6652902f6432135"
      - name: Validate tagged alpha.4 bilingual project quickstart and generator evidence
        run: npm run check:alpha4-projects
      - name: Build exact tagged alpha.4 interpreter
        run: cargo build --manifest-path .compiler-alpha4/Cargo.toml --locked --offline
      - name: Run published alpha.4 project create, verify, launch and security lifecycle
        run: npm run test:alpha4-compiler -- .compiler-alpha4/target/debug/scarp
      - name: Verify alpha.4 CLI help, offline capability schema and project error contracts
        run: npm run test:alpha4-cli-compiler -- .compiler-alpha4/target/debug/scarp

  alpha5-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: 2eeed0aa52ccb59523307841ad8ffbd83f8911a8
          path: .compiler-alpha5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript conformance dependencies
        run: npm install --no-audit --no-fund
      - name: Verify exact released alpha.5 source commit
        run: test "$(git -C .compiler-alpha5 rev-parse HEAD)" = "2eeed0aa52ccb59523307841ad8ffbd83f8911a8"
      - name: Check tagged release fixture bytes and bilingual alpha.5 docs
        run: npm run check:alpha5 -- .compiler-alpha5/examples
      - name: Build the exact published alpha.5 interpreter
        run: cargo build --manifest-path .compiler-alpha5/Cargo.toml --locked --offline
      - name: Execute tagged interpreter and inspect project versus file JSON
        run: npm run test:alpha5-compiler -- .compiler-alpha5/target/debug/scarp
      - name: Test the shipped experimental C11 Rust embedding backend
        run: cargo test --manifest-path .compiler-alpha5/Cargo.toml --locked --offline --test c_backend

  alpha6-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: scarp-lang/scarp
          ref: aa329a22cf2bf92d2c9814a26ff9c8b67a72e6e8
          path: .compiler-alpha6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript conformance dependencies
        run: npm install --no-audit --no-fund
      - name: Pin exact published alpha.6 compiler source
        run: test "$(git -C .compiler-alpha6 rev-parse HEAD)" = "aa329a22cf2bf92d2c9814a26ff9c8b67a72e6e8"
      - name: Verify alpha.6 release-pinned source and JSON fixtures
        run: npm run check:alpha6 -- .compiler-alpha6/examples
      - name: Build published alpha.6 interpreter offline
        run: cargo build --manifest-path .compiler-alpha6/Cargo.toml --locked --offline
      - name: Exercise alpha.6 CLI, RMS, static symbols and references
        run: npm run test:alpha6-compiler -- .compiler-alpha6/target/debug/scarp .compiler-alpha6/examples
      - name: Execute bilingual tutorial project with the exact published compiler
        run: npm run test:alpha6-project-compiler -- .compiler-alpha6/target/debug/scarp
