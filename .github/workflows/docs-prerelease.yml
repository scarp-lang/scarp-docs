name: Publish Scarp Docs prerelease

on:
  workflow_run:
    workflows: ["Documentation CI"]
    types: [completed]

# A completed PR run can never publish. Only a passing CI run for a main push
# can start this release. The tag is created from the exact tested commit.
permissions:
  contents: read

concurrency:
  group: scarp-docs-prerelease
  cancel-in-progress: false

jobs:
  publish-docs-prerelease:
    if: >-
      github.repository == 'scarp-lang/scarp-docs' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the passing main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install tools for prerelease policy checks
        run: npm install --no-audit --no-fund
      - name: Refuse stable or mismatched documentation releases
        run: npm run check:docs-prerelease
      - name: Correct first prerelease tag, preserving its original GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: npx tsx scripts/publish-docs-prerelease.ts
