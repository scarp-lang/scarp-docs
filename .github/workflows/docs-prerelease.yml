name: Publish Scarp Docs prerelease

on:
  workflow_run:
    workflows: ["Documentation CI"]
    types: [completed]

# A completed PR run can never publish. Only a passing CI run for a main push
# can start this release. The tag is created from the exact tested commit.
permissions:
  contents: read

concurrency:
  group: scarp-docs-prerelease
  cancel-in-progress: false

jobs:
  publish-docs-prerelease:
    if: >-
      github.repository == 'scarp-lang/scarp-docs' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the passing main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tools for prerelease policy checks
        run: npm install --no-audit --no-fund
      - name: Refuse stable or mismatched documentation releases
        run: npm run check:docs-prerelease
      - name: Publish or verify a documentation-only GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="$(node -p "require('./data/docs-prerelease.json').tag")"
          title="$(node -p "require('./data/docs-prerelease.json').title")"
          notes="$(node -p "require('./data/docs-prerelease.json').notesFile")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing GitHub docs release $tag; no duplicate publication."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file "$notes" \
            --target "$TESTED_SHA" \
            --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url
