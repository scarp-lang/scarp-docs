name: Deploy official documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript, languages, fixtures and deployment API
        run: npm run typecheck && npm run check:docs && npm run check:i18n && npm run check:snippets && npm run test:snippets && npm run check:fixtures && npm run check:alpha2 && npm run check:alpha2-errors && npm run check:alpha3 && npm run check:tutorial-evidence && npm run test:tutorial-evidence && npm run check:coverage-statistics && npm run test:coverage-statistics && npm run test:pages-api && npm run test:site-meta
      - name: Guard Hindi local search and keyboard accessibility
        run: npm run check:hindi-search && npm run test:hindi-search
      - name: Check bilingual release-aware Command Finder before deployment
        run: npm run check:command-finder && npm run test:command-finder
      - name: Validate release-pinned bilingual alpha.6 installation
        run: npm run check:alpha6-installation && npm run test:alpha6-installation
      - name: Verify bilingual published alpha.6 AST debugger guide
        run: npm run check:alpha6-ast && npm run test:alpha6-ast
      - name: Validate bilingual compiler host and capability diagnostics
        run: npm run check:alpha6-diagnose && npm run test:alpha6-diagnose
      - name: Keep Vue/TypeScript and Dependabot compatible
        run: npm run check:toolchain && npm run test:toolchain
      - name: Regression-test complete bilingual sitemap coverage
        run: npm run test:sitemap
      - name: Build static website
        run: npm run docs:build
      - name: Verify generated bilingual HTML and SEO metadata
        run: npm run check:site-build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install TypeScript smoke-check dependencies
        run: npm install --no-audit --no-fund
      - name: Verify public bilingual Pages, clean URLs, SEO, assets and sitemap
        run: npm run check:live-site
